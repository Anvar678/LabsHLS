# Ось orchestrator, значение dagster. Роль `orchestrator`: веб-интерфейс на 8082.
# Один контейнер: веб-интерфейс и демон расписаний вместе (`dagster dev`),
# метаданные прогонов — в PostgreSQL каталога. Запуски идут по одному
# (services/dagster/dagster.yaml): у каждого шага Spark своя JVM.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  orchestrator:
    image: bigdata-stand/dagster:1
    build:
      context: ./services/dagster
    container_name: orchestrator
    hostname: orchestrator
    profiles: [lab7]
    restart: unless-stopped
    depends_on:
      catalog-db: {condition: service_healthy}
    environment:
      # Только адреса и ключи стенда, а не весь .env: правка остальных строк
      # .env не пересоздаёт сервис посреди запуска конвейера.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      CATALOG_URI: ${CATALOG_URI}
      CATALOG_WAREHOUSE: ${CATALOG_WAREHOUSE}
      WAREHOUSE_HOST: ${WAREHOUSE_HOST}
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      DAGSTER_HOME: /opt/dagster/home
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Модули из jobs/ импортируются шагами конвейера напрямую; байт-код в
      # каталоги студента не пишется.
      PYTHONPATH: /opt/jobs
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./data/orchestrator/dagster:/opt/dagster/home
      - ${DAGS_DIR:-./dags}:/opt/dagster/project:ro
      - ${JOBS_DIR:-./jobs}:/opt/jobs:ro
    ports: ["${PORT_ORCHESTRATOR:-8082}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/server_info || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks: [stand]
    mem_limit: 3g
    logging: *logging
