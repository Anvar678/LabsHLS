# Ось broker, значение redpanda. Роли `broker` (9092) и `registry` (8081):
# реестр схем у Redpanda встроен, отдельного сервиса нет; сетевое имя
# `registry` даёт реестру тот же адрес, что у Karapace. Два listener'а:
# изнутри стенда брокер отвечает по broker:9092, программам на стенде вне
# контейнеров — по localhost:$PORT_BROKER. Внешний адрес объявлен как
# localhost, поэтому клиенты брокера запускаются на самом стенде.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  broker:
    image: redpandadata/redpanda:v25.3.17
    container_name: broker
    hostname: broker
    profiles: [lab6, lab8]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:9094
      - --advertise-kafka-addr=internal://broker:9092,external://localhost:${PORT_BROKER:-9092}
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=broker:33145
    volumes: ["./data/broker-redpanda:/var/lib/redpanda/data"]
    ports:
      - "${PORT_BROKER:-9092}:9094"
      - "${PORT_REGISTRY:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      stand:
        aliases: [registry]
    mem_limit: 1500m
    logging: *logging
