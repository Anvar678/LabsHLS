# Ось engine, значение duckdb. Файл нужен, чтобы у каждого значения оси был
# свой файл в COMPOSE_FILE. Роль `engine` — встраиваемый движок: сервера
# нет, запросы идут командой `docker compose run --rm duckdb` (сервис `duckdb`
# в основном файле, профиль `tools`). Порт роли не занимается, профили работ
# сервисов не добавляют.
services:
  duckdb:
    profiles: [tools]
