# Ось bi, значение superset. Роль `bi`: веб-интерфейс на 8088.
# Вход: student / student.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  bi:
    image: bigdata-stand/superset:1
    build:
      context: ./services/superset
    container_name: bi
    hostname: bi
    profiles: [lab5, lab8, lab9]
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: bigdata-stand-secret-key   # учебный стенд, не менять
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      FLASK_APP: superset
    volumes:
      - ./data/bi-superset:/app/superset_home
    command:
      - /bin/bash
      - -c
      - |
        superset db upgrade
        superset fab create-admin --username student --firstname S --lastname S --email s@example.org --password student || true
        superset init
        exec gunicorn -w 2 -k gthread --timeout 120 -b 0.0.0.0:8088 "superset.app:create_app()"
    ports: ["${PORT_BI:-8088}:8088"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    networks: [stand]
    mem_limit: 3g
    logging: *logging
