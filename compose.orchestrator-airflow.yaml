# Ось orchestrator, значение airflow. Роль `orchestrator`: веб-интерфейс на 8082.
# Один контейнер (`standalone`): планировщик, исполнитель и веб-интерфейс
# вместе, метаданные — в PostgreSQL каталога. Вход без пароля: простой менеджер
# входа Airflow 3 считает всех администраторами.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  orchestrator:
    image: bigdata-stand/airflow:1
    build:
      context: ./services/airflow
    container_name: orchestrator
    hostname: orchestrator
    profiles: [lab7]
    restart: unless-stopped
    depends_on:
      catalog-db: {condition: service_healthy}
    command: ["standalone"]
    environment:
      # Только адреса и ключи стенда, а не весь .env: правка остальных строк
      # .env не пересоздаёт сервис посреди запуска конвейера.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      CATALOG_URI: ${CATALOG_URI}
      CATALOG_WAREHOUSE: ${CATALOG_WAREHOUSE}
      WAREHOUSE_HOST: ${WAREHOUSE_HOST}
      WAREHOUSE_USER: ${WAREHOUSE_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      WAREHOUSE_DB: ${WAREHOUSE_DB}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Модули из jobs/ импортируются шагами конвейера напрямую; байт-код в
      # каталоги студента не пишется.
      PYTHONPATH: /opt/jobs
      PYTHONDONTWRITEBYTECODE: "1"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Одна задача за раз: у каждого шага Spark своя JVM, а повторный счёт по
      # умолчанию запускает до десяти суток сразу и упирается в предел памяти.
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # Новый файл в dags/ виден через полминуты, а не через штатные пять минут.
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://catalog:catalog@catalog-db:5432/airflow
      AIRFLOW__API__PORT: "8080"
      AIRFLOW_HOME: /opt/airflow
    volumes:
      - ./data/orchestrator/airflow:/opt/airflow/logs
      - ${DAGS_DIR:-./dags}:/opt/airflow/dags:ro
      - ${JOBS_DIR:-./jobs}:/opt/jobs:ro
    ports: ["${PORT_ORCHESTRATOR:-8082}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v2/version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    networks: [stand]
    mem_limit: 3g
    logging: *logging
