# Ось bi, значение metabase. Роль `bi`: веб-интерфейс на 8088.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  bi:
    image: metabase/metabase:v0.63.16.7
    container_name: bi
    hostname: bi
    profiles: [lab5, lab8, lab9]
    restart: unless-stopped
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: -Xmx1g
    volumes: ["./data/bi-metabase:/metabase-data"]
    ports: ["${PORT_BI:-8088}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks: [stand]
    mem_limit: 2g
    logging: *logging
