# Ось engine, значение starrocks. Роль `engine`: веб-интерфейс на 8080,
# SQL по протоколу MySQL на 9030.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  engine:
    image: bigdata-stand/starrocks:1
    build:
      context: ./services/starrocks
    container_name: engine
    hostname: engine
    profiles: [lab4, lab5, lab7, lab9]
    restart: unless-stopped
    environment:
      # Метаданные таблиц FE пишет через AWS SDK: без этих переменных Garage
      # отвечает «Invalid payload signature» на CREATE TABLE и INSERT.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./data/engine:/data/deploy/starrocks/meta
    ports:
      - "${PORT_ENGINE:-8080}:8030"
      - "${PORT_ENGINE_SQL:-9030}:9030"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    networks: [stand]
    mem_limit: 6g
    logging: *logging
